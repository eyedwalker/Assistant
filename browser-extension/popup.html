<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyecare AI Assistant</title>
    <style>
        body {
            width: 350px;
            height: 500px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
        }
        
        .header {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .header p {
            margin: 8px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
        
        .content {
            padding: 20px;
        }
        
        .status {
            background: white;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #e5e7eb;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .status-item:last-child {
            margin-bottom: 0;
        }
        
        .status-label {
            font-size: 14px;
            color: #6b7280;
        }
        
        .status-value {
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 8px;
        }
        
        .status-connected {
            background: #10b981;
        }
        
        .status-disconnected {
            background: #ef4444;
        }
        
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 14px;
            color: #374151;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .action-btn:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }
        
        .action-btn.primary {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        
        .action-btn.primary:hover {
            background: #2563eb;
        }
        
        .action-icon {
            font-size: 18px;
        }
        
        .action-text {
            flex: 1;
        }
        
        .action-title {
            font-weight: 500;
            margin-bottom: 2px;
        }
        
        .action-desc {
            font-size: 12px;
            opacity: 0.7;
        }
        
        .footer {
            padding: 16px 20px;
            border-top: 1px solid #e5e7eb;
            background: white;
            text-align: center;
        }
        
        .footer a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 12px;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Eyecare AI Assistant</h1>
        <p>Your intelligent companion for eyecare workflows</p>
    </div>
    
    <div class="content">
        <div class="status">
            <div class="status-item">
                <span class="status-label">AI Assistant</span>
                <div style="display: flex; align-items: center;">
                    <span class="status-value" id="ai-status">Checking...</span>
                    <div class="status-indicator" id="ai-indicator"></div>
                </div>
            </div>
            <div class="status-item">
                <span class="status-label">Current Page</span>
                <span class="status-value" id="page-type">Loading...</span>
            </div>
            <div class="status-item">
                <span class="status-label">Context</span>
                <span class="status-value" id="context-info">Analyzing...</span>
            </div>
        </div>
        
        <div class="actions">
            <button class="action-btn primary" id="toggle-overlay">
                <span class="action-icon">💬</span>
                <div class="action-text">
                    <div class="action-title">Open AI Chat</div>
                    <div class="action-desc">Start conversation with context awareness</div>
                </div>
            </button>
            
            <button class="action-btn" id="analyze-page">
                <span class="action-icon">🔍</span>
                <div class="action-text">
                    <div class="action-title">Analyze Page</div>
                    <div class="action-desc">Get insights about current workflow</div>
                </div>
            </button>
            
            <button class="action-btn" id="find-training">
                <span class="action-icon">📚</span>
                <div class="action-text">
                    <div class="action-title">Find Training</div>
                    <div class="action-desc">Get relevant training modules</div>
                </div>
            </button>
            
            <button class="action-btn" id="open-dashboard">
                <span class="action-icon">🏠</span>
                <div class="action-text">
                    <div class="action-title">Open Dashboard</div>
                    <div class="action-desc">Access full AI assistant interface</div>
                </div>
            </button>
        </div>
    </div>
    
    <div class="footer">
        <a href="#" id="settings-link">Settings</a> • 
        <a href="#" id="help-link">Help</a> • 
        <a href="#" id="feedback-link">Feedback</a>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
